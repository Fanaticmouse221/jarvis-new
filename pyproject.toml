[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: a personal AI assistant. Phase 1: text chat foundation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream notice from starlette.testclient; harmless for our tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]
